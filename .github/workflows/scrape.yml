name: Monitor Herencias Nacional

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ejecutar-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml python-dateutil

      - name: Ejecutar el pipeline nacional v4
        run: python pipeline_nacional_v4.py

      - name: Guardar todos los CSV como artefactos descargables
        uses: actions/upload-artifact@v4
        with:
          name: expedientes-y-resumenes
          path: |
            expedientes_nacional.csv
            expedientes_estatal.csv
            expedientes_autonomico.csv
            expedientes_provincial.csv
            expedientes_internacional.csv
            resumen_por_provincia.csv
            urgentes_1_mes.csv

      - name: Confirmar y subir los CSV al propio repositorio
        run: |
          git config user.name "bot-monitor"
          git config user.email "bot@tudominio.es"
          git add expedientes_nacional.csv expedientes_estatal.csv expedientes_autonomico.csv expedientes_provincial.csv expedientes_internacional.csv resumen_por_provincia.csv urgentes_1_mes.csv
          git commit -m "Actualizacion automatica" || echo "Sin cambios que subir"
          git push
